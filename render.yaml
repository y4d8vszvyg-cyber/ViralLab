# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: virallab
    runtime: docker
    plan: starter # persistent disk requires a paid plan
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: virallab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: FREE_LIMIT
        value: "10"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
