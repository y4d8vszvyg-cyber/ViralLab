# Fly.io: fly launch --copy-config --no-deploy && fly volumes create virallab_data --size 1 && fly deploy
app = "virallab"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "virallab_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"
